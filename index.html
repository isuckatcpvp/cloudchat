<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Chat</title>
<style>
:root{--bg:#0e1526;--panel:#141d33;--line:#25324f;--ink:#e8f0ff;--dim:#8da0c0;--ac:#8ec5ff;--acink:#0a1830;--bad:#ff8a8a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 ui-rounded,"Trebuchet MS",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
input{background:#0b1120;border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
input:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{background:var(--ac);color:var(--acink);border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.sm{padding:5px 10px;font-size:13px}
.hide{display:none!important}
#login{height:100%;display:grid;place-items:center;padding:16px}
#login form{width:min(360px,100%);display:grid;gap:10px}
#login h1{margin:0 0 4px;font-size:30px}
#login p{margin:0 0 6px;color:var(--dim)}
#err{color:var(--bad);min-height:20px;font-size:13px}
#app{height:100%;display:grid;grid-template-columns:300px 1fr}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#me{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:700}
#add{padding:10px 14px;display:flex;gap:6px}
#list{overflow:auto;flex:1;padding:0 8px 8px}
h3{margin:14px 8px 6px;font-size:13px;color:var(--dim);font-weight:700}
.row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer}
.row:hover,.row.on{background:#1e2c4a}
.row .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:30px;height:30px;border-radius:50%;background:var(--ac);color:var(--acink);display:grid;place-items:center;font-weight:800;flex:none}
.av.grp{border-radius:9px;background:#b9a8ff}
.badge{background:var(--bad);color:#2a0a0a;border-radius:99px;min-width:20px;padding:1px 6px;text-align:center;font-size:12px;font-weight:800}
.req{padding:8px;border:1px dashed var(--line);border-radius:8px;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.req span{flex:1}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#head{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;gap:10px;align-items:center}
#back{display:none}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:2px}
.m{display:flex;gap:10px;padding:4px 0}
.m .b{min-width:0}
.m b{margin-right:8px}.m time{color:var(--dim);font-size:12px}
.m div div{white-space:pre-wrap;overflow-wrap:anywhere}
.empty{margin:auto;color:var(--dim);text-align:center;max-width:300px}
#send{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;width:min(380px,92vw)}
dialog::backdrop{background:#0009}
dialog label{display:flex;gap:8px;padding:4px 0;align-items:center}
dialog label input{width:auto}
textarea,select{background:#0b1120;border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;color:inherit;font:inherit}
textarea{resize:none;height:70px}
.av{position:relative}.av img{width:100%;height:100%;border-radius:inherit;object-fit:cover}
.dot{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--panel)}
.dot.online{background:#6fdc8c}.dot.away{background:#f5c451}.dot.dnd{background:#ff6b6b}
#pp .av{width:64px;height:64px;font-size:26px}
@supports(height:100dvh){html,body,#app,#login{height:100dvh}}
@media(max-width:700px){
input,textarea,select{font-size:16px}
#app{grid-template-columns:1fr}
#main{display:none}
#app.chat #side{display:none}#app.chat #main{display:flex}
#back{display:inline-block}}
</style>
</head>
<body>

<div id="login">
 <form id="lf">
  <h1>Cloud Chat</h1>
  <p>Pick a username and password. No email needed.</p>
  <input id="u" placeholder="Username" autocomplete="username" maxlength="20" required>
  <input id="p" type="password" placeholder="Password" autocomplete="current-password" required>
  <button type="submit" id="bl">Log in</button>
  <button type="button" class="g" id="bc">Create account</button>
  <div id="err" role="alert"></div>
  <small style="color:var(--dim)">build 7</small>
  <details><summary style="color:var(--dim);cursor:pointer">Relay servers</summary>
   <input id="rl" style="margin-top:6px" placeholder="https://your-relay.example/gun, https://another/gun"></details>
 </form>
</div>

<div id="app" class="hide">
 <aside id="side">
  <div id="me"><div id="mp" title="Edit profile" style="display:flex;gap:8px;align-items:center;cursor:pointer;min-width:0"><span id="mav"></span><span><span id="mn"></span><br><small id="rs" style="color:var(--dim);font-weight:400"></small></span></div><button class="g sm" id="out">Log out</button></div>
  <form id="add"><input id="af" placeholder="Add friend by username" maxlength="20"><button class="sm">Add</button></form>
  <div id="list"></div>
 </aside>
 <section id="main">
  <div id="head"><button class="g sm" id="back">Back</button><span id="ht">Pick a chat</span><small id="hb" style="color:var(--dim);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></small></div>
  <div id="msgs"><div class="empty">Add a friend or create a group to start chatting.</div></div>
  <form id="send" class="hide"><input id="mi" placeholder="Write a message" autocomplete="off"><button>Send</button></form>
 </section>
</div>

<dialog id="pd">
 <form method="dialog" id="pf">
  <h3 style="margin:0 0 10px">Your profile</h3>
  <div style="display:flex;gap:12px;align-items:center;margin-bottom:10px"><div id="pp"></div><input type="file" id="pi" accept="image/*"></div>
  <textarea id="bio" maxlength="150" placeholder="Bio (150 characters)"></textarea>
  <select id="st" style="margin:10px 0"><option value="online">Online</option><option value="away">Away</option><option value="dnd">Do not disturb</option><option value="invisible">Invisible</option></select>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="g" id="px">Cancel</button><button>Save</button></div>
 </form>
</dialog>

<dialog id="gd">
 <form method="dialog" id="gf">
  <h3 style="margin:0 0 10px">New group</h3>
  <input id="gn" placeholder="Group name" maxlength="30" required>
  <div id="gm" style="margin:10px 0;max-height:200px;overflow:auto"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="g" id="gx">Cancel</button><button>Create</button></div>
 </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/gun@0.2020.1240/gun.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gun@0.2020.1240/sea.js"></script>
<script>
const NS='cakechat1', $=s=>document.querySelector(s), SEA=Gun.SEA;
const DEFAULT_RELAYS=['https://relay.peer.ooo/gun'];
const saved=(localStorage.cc_relays||'').split(',').map(s=>s.trim()).filter(Boolean);
$('#rl').value=saved.join(', ');
let gun, user, me={}, friends={}, groups={}, chats={}, reqs={}, cur=null, handled={}, epubs={}, secrets={};

/* ---------- login ---------- */
const err=t=>$('#err').textContent=t;
function init(){
  const peers=($('#rl').value.split(',').map(s=>s.trim()).filter(Boolean));
  localStorage.cc_relays=peers.join(',');
  const pub=peers.length?peers:DEFAULT_RELAYS;
  gun=Gun({peers:[BACKUP_RELAY,...pub]}); user=gun.user(); watchRelays();
}

/* ---------- relays ----------
   Your Render relay is always connected (first), public relays are extras. */
const BACKUP_RELAY='https://cloudchatrelay.onrender.com/gun';
try{fetch(BACKUP_RELAY.replace(/\/gun$/,''),{mode:'no-cors'}).catch(()=>{})}catch(e){} // wake Render while you type
function setRelayStatus(t){const e=$('#rs');if(e)e.textContent=t}
function watchRelays(){
  setRelayStatus('connecting...');
  setInterval(()=>{
    const ps=Object.values(gun.back('opt.peers')||{});
    setRelayStatus(ps.some(p=>p.wire&&p.wire.readyState===1)?'connected':'reconnecting...');
  },2000);
}

function auth(create){
  const n=$('#u').value.trim().toLowerCase(), p=$('#p').value;
  if(!/^[a-z0-9_]{3,20}$/.test(n)) return err('Username: 3-20 letters, numbers or _');
  if(p.length<6) return err('Password needs at least 6 characters');
  err('Working...'); init();
  const login=()=>user.auth(n,p,a=>a.err?err(a.err):start(n));
  create?user.create(n,p,a=>a.err?err(a.err):login()):login();
}
$('#lf').onsubmit=e=>{e.preventDefault();auth(false)};
$('#bc').onclick=()=>auth(true);
$('#out').onclick=()=>{user.leave();location.reload()};

/* ---------- helpers ---------- */
const pairKey=()=>user._.sea;
const wait=(fn,ms=5000)=>new Promise(r=>{let d;const f=v=>{if(!d&&v!=null){d=1;r(v)}};fn(f);setTimeout(()=>{if(!d){d=1;r(null)}},ms)});
const getEpub=pub=>epubs[pub]?Promise.resolve(epubs[pub]):wait(f=>gun.user(pub).get('epub').once(f)).then(v=>epubs[pub]=v);
const getName=pub=>wait(f=>gun.user(pub).get('alias').once(f));
async function secret(pub){
  if(secrets[pub]) return secrets[pub];
  const e=await getEpub(pub); if(!e) return null;
  return secrets[pub]=await SEA.secret(e,pairKey());
}
function findUser(n){return wait(f=>gun.get('~@'+n).once(d=>{
  if(!d) return; const k=Object.keys(d).find(k=>k[0]==='~'); if(k) f(k.slice(1));}))}
const dmId=p=>'dm_'+[me.pub,p].sort().join('_');
const lrKey=id=>'lr_'+me.pub+id;
const ini=s=>(s||'?')[0].toUpperCase();

/* ---------- profiles ---------- */
let profiles={}, subd={}, pend='';
const LABEL={online:'Online',away:'Away',dnd:'Do not disturb'};
function stat(pub){const p=profiles[pub];
  if(!p||p.status==='invisible'||!(Date.now()-p.seen<75000)) return ''; return p.status||'online'}
function avEl(pub,name,grp){
  const a=document.createElement('div'); a.className='av'+(grp?' grp':''); const p=profiles[pub]||{};
  if(p.pfp&&/^data:image\//.test(p.pfp)){const i=document.createElement('img');i.src=p.pfp;i.alt='';a.append(i)}else a.textContent=ini(name);
  if(pub&&!grp){const s=stat(pub);if(s){const d=document.createElement('i');d.className='dot '+s;a.append(d)}}
  if(p.bio) a.title=p.bio; return a;
}
function hdr(){const c=chats[cur]; if(!c) return; const s=c.pub?stat(c.pub):'', b=c.pub&&profiles[c.pub]&&profiles[c.pub].bio;
  $('#hb').textContent=[s&&LABEL[s],b].filter(Boolean).join(' - ')}
function watchProfile(pub){
  if(subd[pub]) return; subd[pub]=1;
  gun.user(pub).get('profile').on(p=>{
    if(!p) return; const o=profiles[pub]||{}; profiles[pub]=p;
    if(pub===me.pub) $('#mav').replaceChildren(avEl(pub,me.name));
    if(cur&&(o.pfp!==p.pfp||o.bio!==p.bio)) draw(); hdr(); render();
  });
}
const readPfp=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;
  const s=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,96,96);r(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(f)});
$('#mp').onclick=()=>{const p=profiles[me.pub]||{}; pend=p.pfp||'';
  $('#pp').replaceChildren(avEl(me.pub,me.name)); $('#bio').value=p.bio||''; $('#st').value=p.status||'online'; $('#pd').showModal()};
$('#pi').onchange=async e=>{const f=e.target.files[0]; if(!f) return; pend=await readPfp(f);
  const a=document.createElement('div'),i=new Image(); a.className='av'; i.src=pend; a.append(i); $('#pp').replaceChildren(a)};
$('#px').onclick=()=>$('#pd').close();
$('#pf').onsubmit=()=>{user.get('profile').put({pfp:pend,bio:$('#bio').value.trim().slice(0,150),status:$('#st').value,seen:Date.now()})};

/* ---------- start ---------- */
function start(n){
  me={pub:user.is.pub,name:n};
  $('#login').classList.add('hide'); $('#app').classList.remove('hide');
  $('#mn').textContent=n;
  if('Notification' in window&&Notification.permission==='default') Notification.requestPermission();
  watchProfile(me.pub); const beat=()=>user.get('profile').put({seen:Date.now()}); beat(); setInterval(beat,30000);
  // friends
  user.get('friends').map().on((v,pub)=>{
    if(v&&v.name){friends[pub]={name:v.name};watchProfile(pub);openChat(dmId(pub),'dm',v.name,pub)}
    else delete friends[pub];
    render();
  });
  // groups (stored encrypted in my own space)
  user.get('groups').map().on(async(v,id)=>{
    if(!v) return;
    const g=await SEA.decrypt(v,pairKey()); if(!g) return;
    groups[id]=g; openChat(id,'group',g.name,null,g.key); render();
  });
  // inbox: friend requests, accepts, group invites
  gun.get(NS+'/in/'+me.pub).map().on((m,id)=>{
    if(!m||!m.t||handled[id]) return; handled[id]=1; inbox(m,id);
  });
}
async function inbox(m,id){
  const del=()=>{gun.get(NS+'/in/'+me.pub).get(id).put(null);delete reqs[id];render()};
  if(m.t==='req'){
    const name=await getName(m.from); if(!name) return del();
    if(friends[m.from]){await accept(m.from,name);return del()}
    reqs[id]={from:m.from,name,del};render();
  }else if(m.t==='acc'){
    const name=await getName(m.from); if(name) user.get('friends').get(m.from).put({name}); del();
  }else if(m.t==='inv'){
    const s=await secret(m.from); const g=s&&await SEA.decrypt(m.c,s);
    if(g&&g.id&&g.key) await saveGroup(g); del();
  }
}
const send=(pub,m)=>gun.get(NS+'/in/'+pub).set(m);
async function accept(pub,name){
  user.get('friends').get(pub).put({name}); send(pub,{t:'acc',from:me.pub});
}

/* ---------- friends ---------- */
$('#add').onsubmit=async e=>{
  e.preventDefault(); const n=$('#af').value.trim().toLowerCase(); $('#af').value='';
  if(!n||n===me.name) return;
  const pub=await findUser(n); if(!pub) return alert('No user "'+n+'" found (or relays are slow). Try again.');
  if(friends[pub]) return alert(n+' is already your friend.');
  send(pub,{t:'req',from:me.pub}); alert('Friend request sent to '+n+'. They need to accept it.');
};

/* ---------- chats ---------- */
async function openChat(id,type,title,pub,key){
  if(chats[id]){chats[id].title=title;return}
  const c=chats[id]={id,type,title,pub,msgs:{},seen:{},unread:0,key:key||(pub&&await secret(pub))};
  if(!c.key){delete chats[id];setTimeout(()=>openChat(id,type,title,pub,key),4000);return}
  gun.get(NS+'/m/'+id).map().on(async(m,k)=>{
    if(!m||!m.c||c.msgs[k]) return; c.msgs[k]=1;
    const o=await SEA.decrypt(m.c,c.key); if(!o) return;
    const sk=o.from+'|'+o.t; if(c.seen[sk]) return; c.seen[sk]=1; c.msgs[k]=o; watchProfile(o.from);
    const lr=+localStorage[lrKey(id)]||0;
    if(cur===id&&!document.hidden){localStorage[lrKey(id)]=Date.now();draw()}
    else if(o.from!==me.pub&&o.t>lr){
      c.unread++;
      if(document.hidden&&'Notification' in window&&Notification.permission==='granted'&&(profiles[me.pub]||{}).status!=='dnd') try{new Notification(c.title,{body:o.name+': '+o.text})}catch(e){}
    }
    if(cur===id) draw(); render();
  });
}
function select(id){
  cur=id; const c=chats[id]; c.unread=0; localStorage[lrKey(id)]=Date.now();
  $('#app').classList.add('chat'); $('#send').classList.remove('hide');
  $('#ht').textContent=(c.type==='group'?'# ':'@ ')+c.title; hdr(); draw(); render(); $('#mi').focus();
}
$('#back').onclick=()=>{cur=null;$('#app').classList.remove('chat');render()};
function draw(){
  const box=$('#msgs'), c=chats[cur]; box.textContent='';
  const list=Object.values(c.msgs).filter(m=>m.text).sort((a,b)=>a.t-b.t);
  if(!list.length){const d=document.createElement('div');d.className='empty';d.textContent='No messages yet. Say hi.';box.append(d);return}
  for(const m of list){
    const r=document.createElement('div'); r.className='m';
    const a=avEl(m.from,m.name);
    const b=document.createElement('div'); b.className='b';
    const h=document.createElement('div'),nm=document.createElement('b'),t=document.createElement('time');
    nm.textContent=m.name; t.textContent=new Date(m.t).toLocaleString([], {dateStyle:'short',timeStyle:'short'});
    h.append(nm,t); const x=document.createElement('div'); x.textContent=m.text;
    b.append(h,x); r.append(a,b); box.append(r);
  }
  box.scrollTop=box.scrollHeight;
}
$('#send').onsubmit=async e=>{
  e.preventDefault(); const text=$('#mi').value.trim(); if(!text||!cur) return; $('#mi').value='';
  try{
    const c=chats[cur], o={from:me.pub,name:me.name,text,t:Date.now()};
    c.seen[o.from+'|'+o.t]=1; c.msgs['l'+o.t]=o; draw();
    gun.get(NS+'/m/'+c.id).set({c:await SEA.encrypt(o,c.key)});
  }catch(err){$('#mi').value=text;alert('Could not send: '+(err&&err.message||err))}
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cur){chats[cur].unread=0;localStorage[lrKey(cur)]=Date.now();render()}});

/* ---------- groups ---------- */
async function saveGroup(g){user.get('groups').get(g.id).put(await SEA.encrypt(g,pairKey()))}
$('#gx').onclick=()=>$('#gd').close();
function newGroup(){
  const box=$('#gm'); box.textContent='';
  const fs=Object.entries(friends);
  if(!fs.length) box.textContent='Add some friends first, then invite them here.';
  fs.forEach(([pub,f])=>{const l=document.createElement('label'),i=document.createElement('input');
    i.type='checkbox';i.value=pub;l.append(i,f.name);box.append(l)});
  $('#gn').value=''; $('#gd').showModal();
}
$('#gf').onsubmit=async()=>{
  const picks=[...$('#gm').querySelectorAll('input:checked')].map(i=>i.value);
  const g={id:'g_'+crypto.randomUUID(),name:$('#gn').value.trim(),key:crypto.randomUUID()+crypto.randomUUID(),members:[me.pub,...picks]};
  await saveGroup(g);
  for(const p of picks){const s=await secret(p); if(s) send(p,{t:'inv',from:me.pub,c:await SEA.encrypt(g,s)})}
};

/* ---------- sidebar ---------- */
function row(id,c){
  const r=document.createElement('div'); r.className='row'+(cur===id?' on':''); r.onclick=()=>select(id);
  const a=avEl(c.pub,c.title,c.type==='group');
  const n=document.createElement('span'); n.className='n'; n.textContent=c.title; r.append(a,n);
  if(c.unread){const b=document.createElement('span');b.className='badge';b.textContent=c.unread;r.append(b)}
  return r;
}
function render(){
  const L=$('#list'), st=L.scrollTop; L.textContent='';
  const H=t=>{const h=document.createElement('h3');h.textContent=t;L.append(h)};
  const rs=Object.values(reqs);
  if(rs.length){H('Friend requests ('+rs.length+')');
    rs.forEach(q=>{const d=document.createElement('div');d.className='req';
      const s=document.createElement('span');s.textContent=q.name;
      const y=document.createElement('button');y.className='sm';y.textContent='Accept';y.onclick=async()=>{await accept(q.from,q.name);q.del()};
      const x=document.createElement('button');x.className='g sm';x.textContent='Decline';x.onclick=q.del;
      d.append(s,y,x);L.append(d)})}
  H('Direct messages');
  const dms=Object.values(chats).filter(c=>c.type==='dm');
  dms.forEach(c=>L.append(row(c.id,c)));
  if(!dms.length){const e=document.createElement('div');e.className='row';e.style.cursor='default';e.style.color='var(--dim)';e.textContent='No friends yet';L.append(e)}
  H('Groups');
  Object.values(chats).filter(c=>c.type==='group').forEach(c=>L.append(row(c.id,c)));
  const nb=document.createElement('button');nb.className='g sm';nb.style.margin='6px 8px';nb.textContent='+ New group';nb.onclick=newGroup;L.append(nb);L.scrollTop=st;
  const total=Object.values(chats).reduce((s,c)=>s+c.unread,0)+rs.length;
  document.title=(total?'('+total+') ':'')+'Cloud Chat';
}
</script>
</body>
</html>
